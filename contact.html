<div class="container">

    <label for="cName">الاسم</label>
    <input type="text" id="cName" placeholder="اسمك الكريم" style="display:block;width:100%;padding:12px;border:1px solid #d8dee9;border-radius:10px;font-family:inherit;margin-bottom:12px">
    <label for="cMsg">رسالتك</label>

<script>
document.getElementById('cSend').addEventListener('click', function () {
  var name = document.getElementById('cName').value.trim();
  var msg = document.getElementById('cMsg').value.trim();
  if (!msg) { alert('اكتب رسالتك أولاً.'); return; }
  var subject = encodeURIComponent('رسالة من موقع أدواتي' + (name ? ' — ' + name : ''));
  window.location.href = 'mailto:hasson.9975@gmail.com?subject=' + subject + '&body=' + encodeURIComponent(msg);
});
</script>
