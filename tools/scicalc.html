<script>
(function () {
  'use strict';
  var expr = '';
  var deg = true;
  var exprEl = document.getElementById('scExpr');
  var resEl = document.getElementById('scRes');

  function fact(n) {
    n = Math.round(n);
    if (n < 0 || n > 170 || n !== Math.floor(n)) return NaN;
    var r = 1;
    for (var i = 2; i <= n; i++) r *= i;
    return r;
  }
  function trig(f) {
    return function (x) { var a = deg ? x * Math.PI / 180 : x; return Math[f](a); };
  }
  function atrig(f) {
    return function (x) { var a = Math[f](x); return deg ? a * 180 / Math.PI : a; };
  }

  function evaluate(src) {
    var js = src
      .replace(/π/g, 'PI')
      .replace(/√/g, 'sqrt')
      .replace(/×/g, '*').replace(/÷/g, '/').replace(/−/g, '-')
      .replace(/\^/g, '**');
    if (/[^0-9+\-*/(). %*!a-zA-Z]/.test(js)) throw new Error('bad');
    var scope = {
      PI: Math.PI, e: Math.E,
      sin: trig('sin'), cos: trig('cos'), tan: trig('tan'),
      asin: atrig('asin'), acos: atrig('acos'), atan: atrig('atan'),
      sqrt: Math.sqrt, log: function (x) { return Math.log10(x); },
      ln: Math.log, fact: fact, inv: function (x) { return 1 / x; }
    };
    var withScope = 'with(this){return(' + js
      .replace(/sin\(/g, 'this.sin(').replace(/cos\(/g, 'this.cos(').replace(/tan\(/g, 'this.tan(')
      .replace(/asin\(/g, 'this.asin(').replace(/acos\(/g, 'this.acos(').replace(/atan\(/g, 'this.atan(')
      .replace(/sqrt\(/g, 'this.sqrt(').replace(/log\(/g, 'this.log(').replace(/ln\(/g, 'this.ln(')
      .replace(/inv\(/g, 'this.inv(')
      .replace(/(\d+(?:\.\d+)?)!/g, 'this.fact($1)') + ');}';
    return Function(withScope).call(scope);
  }

  function render(live) {
    exprEl.textContent = expr || ' ';
    if (live && expr) {
      try {
        var v = evaluate(expr);
        resEl.textContent = (typeof v === 'number' && isFinite(v))
          ? Number(v.toPrecision(10)).toLocaleString('en') : 'خطأ';
      } catch (e) { resEl.textContent = '…'; }
    } else if (!expr) {
      resEl.textContent = '0';
    }
  }

  document.getElementById('scKeys').addEventListener('click', function (e) {
    var b = e.target.closest('button');
    if (!b || !b.getAttribute('data-k')) return;
    var k = b.getAttribute('data-k');
    if (k === 'C') { expr = ''; render(false); return; }
    if (k === '⌫') { expr = expr.slice(0, -1); render(true); return; }
    if (k === '±') { expr = expr ? '-(' + expr + ')' : expr; render(true); return; }
    if (k === '=') {
      try {
        var v = evaluate(expr);
        resEl.textContent = (typeof v === 'number' && isFinite(v))
          ? Number(v.toPrecision(10)).toLocaleString('en') : 'خطأ';
        if (isFinite(v)) expr = String(Number(v.toPrecision(10)));
      } catch (e) { resEl.textContent = 'خطأ'; }
      render(false);
      exprEl.textContent = expr || ' ';
      return;
    }
    if (k === '1/(') { expr += 'inv('; render(true); return; }
    expr += k;
    render(true);
  });

  document.getElementById('scMode').addEventListener('click', function () {
    deg = !deg;
    this.textContent = deg ? 'الوضع: درجات' : 'الوضع: راديان';
    render(true);
  });

  render(false);
})();
</script>
