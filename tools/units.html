<body>

<header class="site">
  <div class="container">
    <a class="logo" href="../index.html"><img class="logo-mark" src="../assets/logo.svg" alt="أدواتي" width="34" height="34">أدوات<span>ي</span></a>

<div class="container">
  <div class="breadcrumb"><a href="../index.html">الرئيسية</a> / محول الوحدات</div>

  <div class="ad-slot">مساحة إعلانية</div>

  <div class="tool-box">
    <h2>📏 محول الوحدات</h2>
    <div class="desc">حوّل بين وحدات الطول والوزن والحرارة والمساحة فورياً أثناء الكتابة.</div>

    <div class="un-tabs" id="unTabs">
      <button class="un-tab active" data-cat="length">الطول</button>
      <button class="un-tab" data-cat="weight">الوزن</button>
      <button class="un-tab" data-cat="temp">الحرارة</button>
      <button class="un-tab" data-cat="area">المساحة</button>
    </div>

    <div class="un-grid">
      <div>
        <label for="unVal">القيمة</label>
        <input type="number" id="unVal" step="any" placeholder="مثال: 100">
      </div>
      <div style="text-align:center">
        <label>&nbsp;</label>
        <button class="un-swap" id="unSwap" title="تبديل">⇄</button>
      </div>
      <div>
        <label for="unTo">تحويل إلى</label>
        <select id="unTo"></select>
      </div>
    </div>
    <div style="margin-top:12px">
      <label for="unFrom" style="display:block;font-weight:700;margin-bottom:6px;font-size:14px">من وحدة</label>
      <select id="unFrom"></select>
    </div>

    <div class="result" id="unOut">
      <div class="un-big"><span id="unResNum">—</span> <span id="unResUnit"></span></div>
      <div style="text-align:center;color:#5b6478" id="unFormula"></div>
    </div>
  </div>

  <div class="ad-slot">مساحة إعلانية</div>
</div>

<script>
(function () {
  'use strict';
  /* القيمة: المعامل مقابل الوحدة الأساسية */
  var CATS = {
    length: { base: 'متر', units: [
      ['متر', 1], ['كيلومتر', 1000], ['سنتيمتر', 0.01], ['مليمتر', 0.001],
      ['ميل', 1609.344], ['ياردة', 0.9144], ['قدم', 0.3048], ['بوصة', 0.0254]
    ]},
    weight: { base: 'كيلوغرام', units: [
      ['كيلوغرام', 1], ['غرام', 0.001], ['طن', 1000],
      ['رطل', 0.45359237], ['أوقية', 0.0283495231]
    ]},
    temp: { base: 'مئوية', units: [['مئوية', 0], ['فهرنهايت', 0], ['كلفن', 0]] },
    area: { base: 'متر مربع', units: [
      ['متر مربع', 1], ['كيلومتر مربع', 1000000], ['سنتيمتر مربع', 0.0001],
      ['هكتار', 10000], ['فدان', 4200.83], ['قدم مربعة', 0.09290304]
    ]}
  };
  var cat = 'length';
  var fromSel = document.getElementById('unFrom');
  var toSel = document.getElementById('unTo');

  function fillUnits() {
    var u = CATS[cat].units;
    fromSel.innerHTML = ''; toSel.innerHTML = '';
    u.forEach(function (x, i) {
      var o1 = document.createElement('option'); o1.value = i; o1.textContent = x[0]; fromSel.appendChild(o1);
      var o2 = document.createElement('option'); o2.value = i; o2.textContent = x[0]; toSel.appendChild(o2);
    });
    fromSel.value = '0';
    toSel.value = u.length > 1 ? '1' : '0';
  }

  function convertTemp(v, from, to) {
    var c = from === 0 ? v : (from === 1 ? (v - 32) * 5 / 9 : v - 273.15);
    return to === 0 ? c : (to === 1 ? c * 9 / 5 + 32 : c + 273.15);
  }

  function fmt(n) {
    if (!isFinite(n)) return '—';
    return Number(n.toPrecision(10)).toLocaleString('ar', { maximumFractionDigits: 6 });
  }

  function calc() {
    var v = parseFloat(document.getElementById('unVal').value);
    var out = document.getElementById('unOut');
    if (isNaN(v)) {
      document.getElementById('unResNum').textContent = '—';
      document.getElementById('unResUnit').textContent = '';
      document.getElementById('unFormula').textContent = '';
      out.classList.add('show');
      return;
    }
    var u = CATS[cat].units;
    var fi = parseInt(fromSel.value, 10), ti = parseInt(toSel.value, 10);
    var r = cat === 'temp' ? convertTemp(v, fi, ti) : v * u[fi][1] / u[ti][1];
    document.getElementById('unResNum').textContent = fmt(r);
    document.getElementById('unResUnit').textContent = u[ti][0];
    document.getElementById('unFormula').textContent =
      v.toLocaleString('ar') + ' ' + u[fi][0] + ' = ' + fmt(r) + ' ' + u[ti][0];
    out.classList.add('show');
  }

  document.getElementById('unTabs').addEventListener('click', function (e) {
    var b = e.target.closest('.un-tab');
    if (!b) return;
    Array.prototype.forEach.call(this.querySelectorAll('.un-tab'), function (x) { x.classList.remove('active'); });
    b.classList.add('active');
    cat = b.getAttribute('data-cat');
    fillUnits(); calc();
  });
  document.getElementById('unSwap').addEventListener('click', function () {
    var t = fromSel.value; fromSel.value = toSel.value; toSel.value = t; calc();
  });
  document.getElementById('unVal').addEventListener('input', calc);
  fromSel.addEventListener('change', calc);
  toSel.addEventListener('change', calc);

  fillUnits(); calc();
})();
</script>
