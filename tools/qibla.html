      <div style="position:absolute;top:6px;left:50%;transform:translateX(-50%);font-weight:800">N</div>

<script>
(function () {
  'use strict';
  var KAABA = { lat: 21.4225, lon: 39.8262 };
  var R2D = 180 / Math.PI;

  function bearing(lat1, lon1) {
    var dLon = (KAABA.lon - lon1) / R2D;
    var la1 = lat1 / R2D, la2 = KAABA.lat / R2D;
    var y = Math.sin(dLon) * Math.cos(la2);
    var x = Math.cos(la1) * Math.sin(la2) - Math.sin(la1) * Math.cos(la2) * Math.cos(dLon);
    return (Math.atan2(y, x) * R2D + 360) % 360;
  }

  function show(lat, lon) {
    var b = bearing(lat, lon);
    document.getElementById('qbArrow').style.transform =
      'translate(-50%,-50%) rotate(' + b + 'deg) translateY(-70px)';
    var dirs = ['الشمال', 'الشمال الشرقي', 'الشرق', 'الجنوب الشرقي', 'الجنوب', 'الجنوب الغربي', 'الغرب', 'الشمال الغربي'];
    var dirName = dirs[Math.round(b / 45) % 8];
    var out = document.getElementById('qbOut');
    out.classList.add('show');
    out.innerHTML = 'اتجاه القبلة: <b>' + b.toFixed(1) + '°</b> من الشمال باتجاه عقارب الساعة<br>أي نحو <b>' + dirName + '</b> 🕋';
    // بوصلة حية إن توفرت
    if (window.DeviceOrientationEvent && typeof DeviceOrientationEvent.requestPermission !== 'function') {
      window.addEventListener('deviceorientationabsolute' in window ? 'deviceorientationabsolute' : 'deviceorientation', function (e) {
        if (e.alpha == null) return;
        var heading = e.alpha;
        var rel = (b - heading + 360) % 360;
        document.getElementById('qbArrow').style.transform =
          'translate(-50%,-50%) rotate(' + rel + 'deg) translateY(-70px)';
      });
    }
  }

  function err(t) {
    var e = document.getElementById('qbError');
    e.classList.add('show');
    e.textContent = t;
  }

  document.getElementById('qbGo').addEventListener('click', function () {
    if (!navigator.geolocation) { err('متصفحك لا يدعم تحديد الموقع. أدخل الإحداثيات يدوياً.'); return; }
    err('');
    document.getElementById('qbError').classList.remove('show');
    navigator.geolocation.getCurrentPosition(
      function (p) { show(p.coords.latitude, p.coords.longitude); },
      function () { err('تعذر تحديد الموقع — تأكد من تفعيل GPS وأدخل الإحداثيات يدوياً.'); },
      { timeout: 15000 }
    );
  });

  document.getElementById('qbManual').addEventListener('click', function () {
    var lat = parseFloat(document.getElementById('qbLat').value);
    var lon = parseFloat(document.getElementById('qbLon').value);
    if (isNaN(lat) || isNaN(lon)) { err('أدخل خط العرض وخط الطول.'); return; }
    document.getElementById('qbError').classList.remove('show');
    show(lat, lon);
  });
})();
</script>
