<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>حاسبة الخصم والنسبة المئوية أونلاين | أدواتي</title>
<meta name="description" content="احسب سعر الخصم والوفورات والنسبة المئوية مجاناً داخل المتصفح.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/style.css">
</head>
<body>

<header class="site">
  <div class="container">
    <a class="logo" href="../index.html">أدوات<span>ي</span></a>
    <nav class="main">
      <a href="../index.html">الرئيسية</a>
      <a href="compress.html">ضغط الصور</a>
      <a href="counter.html">عداد الكلمات</a>
    </nav>
  </div>
</header>

<div class="container">
  <div class="breadcrumb"><a href="../index.html">الرئيسية</a> / حاسبة الخصم</div>

  <div class="ad-slot">مساحة إعلانية</div>

  <div class="tool-box">
    <h2>🧮 حاسبة الخصم والنسبة</h2>
    <div class="desc">احسب السعر بعد الخصم، أو اكتشف نسبة الخصم من السعرين.</div>

    <div style="margin-bottom:12px">
      <label style="display:inline-block;margin-left:16px"><input type="radio" name="dcMode" value="discount" checked style="width:auto"> احسب السعر بعد الخصم</label>
      <label style="display:inline-block"><input type="radio" name="dcMode" value="percent" style="width:auto"> اكتشف نسبة الخصم</label>
    </div>

    <div id="dcDiscount">
      <label for="dcPrice">السعر الأصلي</label>
      <input type="number" id="dcPrice" min="0" step="any" placeholder="مثال: 200" style="display:block;width:100%;padding:12px;border:1px solid #d8dee9;border-radius:10px;font-family:inherit;margin-bottom:12px">
      <label for="dcPct">نسبة الخصم: <span id="dcPctVal">20</span>%</label>
      <input type="range" id="dcPct" min="0" max="95" value="20">
    </div>

    <div id="dcPercent" style="display:none">
      <label for="dcOld">السعر قبل الخصم</label>
      <input type="number" id="dcOld" min="0" step="any" placeholder="مثال: 200" style="display:block;width:100%;padding:12px;border:1px solid #d8dee9;border-radius:10px;font-family:inherit;margin-bottom:12px">
      <label for="dcNew">السعر بعد الخصم</label>
      <input type="number" id="dcNew" min="0" step="any" placeholder="مثال: 150" style="display:block;width:100%;padding:12px;border:1px solid #d8dee9;border-radius:10px;font-family:inherit;margin-bottom:12px">
    </div>

    <div class="result" id="dcOut">
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;text-align:center">
        <div class="stat"><span id="dcA">—</span><small id="dcALabel">السعر النهائي</small></div>
        <div class="stat"><span id="dcB">—</span><small id="dcBLabel">الوفورات</small></div>
        <div class="stat"><span id="dcC">—</span><small id="dcCLabel">نسبة الخصم</small></div>
      </div>
    </div>
  </div>

  <div class="ad-slot">مساحة إعلانية</div>
</div>

<footer class="site"><div class="container"><p>أدواتي © 2026 — <a href="../index.html">الرئيسية</a> · <a href="../about.html">من نحن</a> · <a href="../privacy.html">سياسة الخصوصية</a> · <a href="../contact.html">اتصل بنا</a></p></div></footer>

<script>
(function () {
  'use strict';
  function fmt(n) {
    return n.toLocaleString('ar', { maximumFractionDigits: 2 });
  }
  function mode() { return document.querySelector('input[name="dcMode"]:checked').value; }

  function calc() {
    var out = document.getElementById('dcOut');
    if (mode() === 'discount') {
      var price = parseFloat(document.getElementById('dcPrice').value) || 0;
      var pct = parseFloat(document.getElementById('dcPct').value) || 0;
      var save = price * pct / 100;
      document.getElementById('dcA').textContent = fmt(price - save);
      document.getElementById('dcB').textContent = fmt(save);
      document.getElementById('dcC').textContent = fmt(pct) + '%';
      document.getElementById('dcALabel').textContent = 'السعر النهائي';
      document.getElementById('dcBLabel').textContent = 'الوفورات';
      document.getElementById('dcCLabel').textContent = 'نسبة الخصم';
    } else {
      var oldP = parseFloat(document.getElementById('dcOld').value) || 0;
      var newP = parseFloat(document.getElementById('dcNew').value) || 0;
      var pct2 = oldP > 0 ? Math.max(0, (oldP - newP) / oldP * 100) : 0;
      document.getElementById('dcA').textContent = fmt(pct2) + '%';
      document.getElementById('dcB').textContent = fmt(Math.max(0, oldP - newP));
      document.getElementById('dcC').textContent = fmt(newP);
      document.getElementById('dcALabel').textContent = 'نسبة الخصم';
      document.getElementById('dcBLabel').textContent = 'الوفورات';
      document.getElementById('dcCLabel').textContent = 'السعر النهائي';
    }
    out.classList.add('show');
  }

  document.querySelectorAll('input[name="dcMode"]').forEach(function (el) {
    el.addEventListener('change', function () {
      var d = mode() === 'discount';
      document.getElementById('dcDiscount').style.display = d ? 'block' : 'none';
      document.getElementById('dcPercent').style.display = d ? 'none' : 'block';
      calc();
    });
  });
  ['dcPrice', 'dcPct', 'dcOld', 'dcNew'].forEach(function (id) {
    document.getElementById(id).addEventListener('input', function () {
      if (id === 'dcPct') document.getElementById('dcPctVal').textContent = this.value;
      calc();
    });
  });
  calc();
})();
</script>

<script src="../assets/i18n.js"></script>

</body>
</html>
