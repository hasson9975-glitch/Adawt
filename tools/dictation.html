    <div class="dc-row">
      <button class="btn" id="dcCopy">📋 نسخ النص</button>

<script>
(function () {
  'use strict';
  var mic = document.getElementById('dcMic');
  var status = document.getElementById('dcStatus');
  var text = document.getElementById('dcText');
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  var rec = null, listening = false, baseText = '';

  function setStatus(s) { status.textContent = s; }

  if (!SR) {
    setStatus('عذراً، متصفحك لا يدعم التعرف الصوتي — جرّب متصفح كروم');
    mic.disabled = true;
    mic.style.opacity = '.4';
  }

  function start() {
    rec = new SR();
    rec.lang = document.getElementById('dcLang').value;
    rec.interimResults = true;
    rec.continuous = true;
    baseText = text.value ? text.value.replace(/\s+$/, '') + ' ' : '';
    rec.onresult = function (e) {
      var interim = '';
      for (var i = 0; i < e.results.length; i++) {
        if (e.results[i].isFinal) baseText += e.results[i][0].transcript + ' ';
        else interim += e.results[i][0].transcript;
      }
      text.value = baseText + interim;
    };
    rec.onerror = function (e) {
      if (e.error === 'not-allowed') setStatus('تم رفض إذن الميكروفون — اسمح بالوصول من إعدادات المتصفح');
      else if (e.error !== 'aborted') setStatus('حدث خطأ: ' + e.error);
    };
    rec.onend = function () {
      if (listening) { try { rec.start(); } catch (x) {} }
    };
    try {
      rec.start();
      listening = true;
      mic.classList.add('live');
      setStatus('أستمع الآن... تحدث بوضوح');
    } catch (x) { setStatus('تعذر بدء الاستماع'); }
  }

  function stop() {
    listening = false;
    if (rec) { try { rec.stop(); } catch (x) {} }
    mic.classList.remove('live');
    setStatus('اضغط على الميكروفون وابدأ التحدث');
  }

  mic.addEventListener('click', function () {
    if (!SR) return;
    if (listening) stop(); else start();
  });

  document.getElementById('dcCopy').addEventListener('click', function () {
    var done = function () {
      document.getElementById('dcCopied').textContent = 'تم النسخ ✓';
      setTimeout(function () { document.getElementById('dcCopied').textContent = ''; }, 2000);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text.value).then(done, done);
    } else { text.select(); try { document.execCommand('copy'); } catch (x) {} done(); }
  });
  document.getElementById('dcClear').addEventListener('click', function () { text.value = ''; });
})();
</script>
